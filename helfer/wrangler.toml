# Konfiguration für den Fener-Helfer (wird von deploy.sh benutzt)
name = "fener-helfer"
main = "fener-helfer.js"
compatibility_date = "2025-09-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[vars]
APP_URL = "https://5kgfb8k2zn-lang.github.io/Fener-Simulator-/"

[[d1_databases]]
binding = "DB"
database_name = "fener"
database_id = "__D1_ID__"
